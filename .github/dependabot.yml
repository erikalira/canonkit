# Keeps the SHA-pinned actions in .github/workflows current: Dependabot bumps the
# SHA and the "# vX.Y.Z" comment beside it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is proposed only after it has been public for a week, so a
    # compromised tag has time to be noticed. Security updates are not delayed.
    cooldown:
      default-days: 7
    # One PR per week for all actions, not one per action.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
