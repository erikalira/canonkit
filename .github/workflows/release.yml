# canonkit installs a hook that runs on every tool call, so the published
# tarball is worth more to an attacker than the repository is. Publishing only
# from here means npm attaches provenance (the commit and workflow that built
# it) and no long-lived npm token exists to steal: trusted publishing
# authenticates the publish with this run's OIDC token.
#
# The tarball includes the compiled dashboard, built by the unprivileged
# `build-dashboard` job and verified (commit and manifest hash) by `publish`.
# Provenance attests the published bytes and this workflow run; it does not
# attest the build inputs, which the SHA and hash checks tie to the commit.
#
# The trusted publisher on npmjs.com must name this file (release.yml) and the
# `npm` environment, exactly. Steps: docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The tarball ships the compiled dashboard (dashboard/dist, gitignored), so
  # something has to build it, and building runs devDependency code (vite,
  # esbuild, react). That code runs HERE, in a job that holds only
  # `contents: read`: no id-token, no environment, no secrets. The publish job
  # below never installs or builds; it receives dist as a plain artifact and
  # checks it against the commit and the hash recorded by this job.
  build-dashboard:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      dist-sha256: ${{ steps.build.outputs.dist_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No `cache: npm`: nothing is restored that another job could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # --ignore-scripts: no dependency lifecycle script runs. esbuild ships its
      # binary as an optional platform package, so its postinstall is only an
      # optimisation and is not needed. If the build below ever fails for a
      # missing esbuild binary, allow `npm rebuild esbuild` here, not scripts
      # in general.
      - run: npm ci --ignore-scripts

      # vite is invoked directly, not through `npm run dashboard:build`, so the
      # prepack/pretest hooks are not involved. Same arguments as that script.
      - name: Build the dashboard and record its manifest hash
        id: build
        run: |
          npx --no-install vite build dashboard --config dashboard/vite.config.mts
          test -f dashboard/dist/index.html
          test -z "$(find dashboard/dist ! -type f ! -type d)"
          # Sorted, so the hash does not depend on filesystem order.
          manifest=$(cd dashboard/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          printf '%s\n' "$manifest"
          hash=$(printf '%s\n' "$manifest" | sha256sum | cut -d' ' -f1)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dist_sha256=$hash" >> "$GITHUB_OUTPUT"

      # Only dist leaves this job. Fixed name, one day of retention, and no
      # other workflow's artifact is ever used for publishing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [test, build-dashboard]
    runs-on: ubuntu-latest
    # Approval and the tag rule live on the environment, outside this file.
    environment:
      name: npm
      # The link the Deployments entry on the repository page opens.
      url: https://www.npmjs.com/package/canonkit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No npm cache: it is shared with the test jobs, and the publish job
      # restores nothing another job could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v"

      # Catches a mistake, not an attacker: this check runs from the tagged
      # commit's own copy of this file. The controls are the tag ruleset and
      # the environment approval (docs/releasing.md). Releases are stable-only:
      # a prerelease version would be published as `latest`.
      - name: Tag is on main, stable, and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          v=$(node -p 'require("./package.json").version')
          case "$v" in *-*) echo "prerelease $v is not published from here"; exit 1 ;; esac
          test "v$v" = "$GITHUB_REF_NAME"

      # The build job must have built this exact commit.
      - name: dist was built from this commit
        env:
          BUILD_SHA: ${{ needs.build-dashboard.outputs.sha }}
        run: test -n "$BUILD_SHA" && test "$BUILD_SHA" = "$GITHUB_SHA"

      # dashboard/dist is gitignored, so it is absent from this checkout. It
      # arrives as data only, into exactly that directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist

      # Ties the downloaded bytes to what the build job produced: a different
      # or altered artifact fails here, before anything is published.
      - name: dist matches the build job's manifest hash
        env:
          EXPECTED: ${{ needs.build-dashboard.outputs.dist-sha256 }}
        run: |
          test -n "$EXPECTED"
          test -f dashboard/dist/index.html
          test -z "$(find dashboard/dist ! -type f ! -type d)"
          manifest=$(cd dashboard/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          actual=$(printf '%s\n' "$manifest" | sha256sum | cut -d' ' -f1)
          echo "expected $EXPECTED"
          echo "actual   $actual"
          test "$actual" = "$EXPECTED"

      # The tarball's file list goes into the log, for the review after the fact.
      - run: npm pack --dry-run --ignore-scripts

      # Fails before publish if the tarball lacks the dashboard or carries
      # something that must never ship.
      - name: Tarball contains the dashboard and nothing it must not
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            if (!files.includes("dashboard/dist/index.html")) { console.error("tarball lacks dashboard/dist/index.html"); process.exit(1); }
            const bad = files.filter((p) => /(^|\/)node_modules\//.test(p) || /\.map$/.test(p) || /(^|\/)\.env/.test(p));
            if (bad.length) { console.error("tarball carries forbidden files:", bad.join(", ")); process.exit(1); }
          ' "$RUNNER_TEMP/pack.json"

      # Every step in this job can mint the publish token, so nothing is
      # installed or built here: no `npm ci`, no cache, and --ignore-scripts
      # skips prepack (the dashboard build, done above in the unprivileged
      # job) and prepublishOnly, whose tests already passed in the `test` job
      # on this same commit. The only code from outside the repository that
      # runs here is the pinned actions and the compiled dist, which npm packs
      # as data and never executes.
      # Provenance is automatic under trusted publishing; the flag makes a
      # missing attestation fail the publish instead of passing silently.
      - run: npm publish --provenance --ignore-scripts

  # Its own job so that `contents: write` never reaches the job that can mint
  # the npm publish token. It runs only after the publish succeeded.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Notes come from docs/release-notes/X.Y.Z.md (docs/releasing.md step 1).
      # A rerun must not fail because the release already exists.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          notes="docs/release-notes/${TAG#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            echo "::warning::$notes is missing; using generated notes"
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      # Link on the run page, written here because this job holds no OIDC
      # token and the release it points to exists by now.
      - name: Link to the published package
        run: |
          name=$(node -p 'require("./package.json").name')
          v=$(node -p 'require("./package.json").version')
          {
            echo "### Published \`$name@$v\`"
            echo
            echo "- [npm: $name@$v](https://www.npmjs.com/package/$name/v/$v)"
            echo "- [GitHub release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)"
          } >> "$GITHUB_STEP_SUMMARY"
