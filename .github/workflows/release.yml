# canonkit installs a hook that runs on every tool call, so the published
# tarball is worth more to an attacker than the repository is. Publishing only
# from here means npm attaches provenance (the commit and workflow that built
# it) and no long-lived npm token exists to steal: trusted publishing
# authenticates the publish with this run's OIDC token.
#
# The trusted publisher on npmjs.com must name this file (release.yml) and the
# `npm` environment, exactly. Steps: docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Approval and the tag rule live on the environment, outside this file.
    environment:
      name: npm
      # The link the Deployments entry on the repository page opens.
      url: https://www.npmjs.com/package/canonkit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No npm cache: it is shared with the test jobs, and the publish job
      # restores nothing another job could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v"

      # Catches a mistake, not an attacker: this check runs from the tagged
      # commit's own copy of this file. The controls are the tag ruleset and
      # the environment approval (docs/releasing.md). Releases are stable-only:
      # a prerelease version would be published as `latest`.
      - name: Tag is on main, stable, and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          v=$(node -p 'require("./package.json").version')
          case "$v" in *-*) echo "prerelease $v is not published from here"; exit 1 ;; esac
          test "v$v" = "$GITHUB_REF_NAME"

      # The tarball's file list goes into the log, for the review after the fact.
      - run: npm pack --dry-run --ignore-scripts

      # Every step in this job can mint the publish token, so nothing else
      # runs here: no `npm ci` (the package has no build and publish needs no
      # node_modules) and --ignore-scripts skips prepublishOnly, whose tests
      # already passed in the `test` job on this same commit.
      # Provenance is automatic under trusted publishing; the flag makes a
      # missing attestation fail the publish instead of passing silently.
      - run: npm publish --provenance --ignore-scripts

  # Its own job so that `contents: write` never reaches the job that can mint
  # the npm publish token. It runs only after the publish succeeded.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Notes come from docs/release-notes/X.Y.Z.md (docs/releasing.md step 1).
      # A rerun must not fail because the release already exists.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          notes="docs/release-notes/${TAG#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            echo "::warning::$notes is missing; using generated notes"
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      # Link on the run page, written here because this job holds no OIDC
      # token and the release it points to exists by now.
      - name: Link to the published package
        run: |
          name=$(node -p 'require("./package.json").name')
          v=$(node -p 'require("./package.json").version')
          {
            echo "### Published \`$name@$v\`"
            echo
            echo "- [npm: $name@$v](https://www.npmjs.com/package/$name/v/$v)"
            echo "- [GitHub release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)"
          } >> "$GITHUB_STEP_SUMMARY"
